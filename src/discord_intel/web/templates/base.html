<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Discord Links{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/links"><span class="brand-mark" aria-hidden="true">↗</span> Discord Links</a>
    <div class="account">
      <span class="private-label">For your server</span>
      {% if csrf %}<form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="quiet" type="submit">Sign out</button>
      </form>{% endif %}
    </div>
  </header>
  {% block content %}{% endblock %}
  <footer>Good links deserve a place to land.</footer>
</body>
</html>
